[overrides]
files = '.'
strict = 'False'
warn_unreachable = 'True'
warn_incomplete_stub = 'True'
warn_unused_configs = 'True'
disallow_any_generics = 'True'
disallow_subclassing_any = 'True'
disallow_untyped_calls = 'True'
disallow_untyped_defs = 'True'
disallow_incomplete_defs = 'True'
check_untyped_defs = 'True'
disallow_untyped_decorators = 'True'
warn_redundant_casts = 'True'
warn_unused_ignores = 'True'
warn_return_any = 'True'
extra_checks = 'True'
implicit_reexport = 'False'
strict_equality = 'True'

[modules."tests.*"]
comment = 'This section should only define values that are different than in global section'
disallow_untyped_defs = 'False'
disallow_incomplete_defs = 'False'

[modules."tests.*.conftest"]
comment = 'Conftests should be checked in the same manner as production code, so they revert `tests.*` overwrites'
disallow_untyped_defs = 'True'
disallow_incomplete_defs = 'True'
